version: 2
snapshot:
  version_template: '{{ .Env.RELEASE_VERSION }}'
before:
  hooks:
    - ./scripts/build-dashboard.sh
builds:
  - main: ./cmd/pinchtab
    binary: pinchtab-{{ .Os }}-{{ .Arch }}
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
archives:
  - format: binary
    name_template: "pinchtab-{{ .Os }}-{{ .Arch }}"
checksum:
  name_template: checksums.txt
  algorithm: sha256
release:
  github:
    owner: '{{ .Env.GITHUB_REPOSITORY_OWNER }}'
    name: '{{ .Env.RELEASE_REPOSITORY_NAME }}'
changelog:
  sort: asc
